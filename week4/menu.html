<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Menu</title>
    <style>
        .header {
            max-width: 1280px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: auto;
        }

        .bar {
            display: flex;
            gap: 20px;
            font-size: 20px;
            font-weight: 400;
        }

        .bar a {
            color: black;
            text-decoration: none;
        }

        .bar .service a {
            color: #F9612B;

        }

        .phone {
            display: flex;
            align-items: center;
        }

        .phone p {
            margin: 0px 20px 0px 20px;
            font-size: 20px;
            font-weight: 600;
        }

        .phone button {
            background-color: #F9612B;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
        }

        .call {
            display: none;
        }

        @media screen and (max-width: 1080px) {
            .header {
                align-items: center;
                margin: 20px 10px;
            }

            .bar {
                display: none;
            }

            .phone {
                align-items: left;

            }

            .phone button {
                display: none;
            }

            .call {
                display: block;
            }
        }

        @media screen and (max-width: 720px) {

            .phone {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="image/elementralogo.png" alt="Logo" width="200px">
        <div class="bar">
            <div><a href="home.html">Home</a></div>
            <div class="service"><a href="service.html">Service</a></div>
            <div><a href="project.html">Project</a></div>
            <div><a href="contact.html">Contact</a></div>
        </div>

        <div class="phone">
            <img src="image/phone.png" alt="Phone" width="30px">
            <p>555-123-4567</p>
            <button>Contact</button>
        </div>
        <div class="call">
            <img src="image/image.png" alt="Phone" width="30px">

        </div>
    </div>
</body>

</html>
