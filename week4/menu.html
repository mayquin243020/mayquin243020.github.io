<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Menu</title>
    <style>
        .header {
            max-width: 1280px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: auto;
        }

        .bar {
            display: flex;
            gap: 20px;
            font-size: 20px;
            font-weight: 400;
        }

        .bar a {
            color: black;
            text-decoration: none;
        }

        .bar .service a {
            color: #F9612B;

        }

        .phone {
            display: flex;
            align-items: center;
        }

        .phone p {
            margin: 0px 20px 0px 20px;
            font-size: 20px;
            font-weight: 600;
        }

        .phone button {
            background-color: #F9612B;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
        }

        .call {
            display: none;
        }
    </style>
</head>

<body>
    <div class="header">
        <img srd </div>

</body>

</html>
